name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 📦 Build Frontend (Vue 3 -> Laravel SPA & Public Assets)
        run: |
          cd frontend
          npm ci
          npm run build:deploy

      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, pdo_sqlite, bcmath, gd, zip, fileinfo, gmp
          coverage: none

      - name: 📦 Install Backend Production Dependencies (Composer)
        run: |
          cd backend
          cp .env.example .env
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-reqs
          rm -f .env

      - name: 🔐 Setup SSH and Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass rsync

      - name: 🔑 Configure SSH Authentication
        env:
          SSH_KEY: ${{ secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SSH_KEY" ]; then
            echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            echo "SSH Private Key configured."
          fi
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 📁 Ensure Remote Directory Exists
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          TARGET_DIR: ${{ secrets.SSH_TARGET_DIR || 'public_html' }}
        run: |
          if [ -f ~/.ssh/id_rsa ]; then
            ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "mkdir -p $TARGET_DIR"
          else
            sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "mkdir -p $TARGET_DIR"
          fi

      - name: 🚀 Sync Production Files to Hostinger (rsync)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          TARGET_DIR: ${{ secrets.SSH_TARGET_DIR || 'public_html' }}
        run: |
          RSYNC_SSH="ssh -p $SSH_PORT -o StrictHostKeyChecking=no"
          if [ ! -f ~/.ssh/id_rsa ]; then
            RSYNC_SSH="sshpass -e ssh -p $SSH_PORT -o StrictHostKeyChecking=no"
          fi

          rsync -avz --delete \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='phpunit.xml' \
            --exclude='database/*.sqlite' \
            --exclude='database/*.sqlite-journal' \
            --exclude='storage/app/public/*' \
            --exclude='storage/app/private/*' \
            --exclude='storage/app/backups/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/logs/*' \
            --exclude='public/storage' \
            -e "$RSYNC_SSH" \
            backend/ "$SSH_USER@$SSH_HOST:$TARGET_DIR/"

      - name: ⚡ Run Post-Deployment Tasks on Hostinger
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          TARGET_DIR: ${{ secrets.SSH_TARGET_DIR || 'public_html' }}
        run: |
          SSH_PREFIX=""
          if [ ! -f ~/.ssh/id_rsa ]; then
            SSH_PREFIX="sshpass -e"
          fi

          $SSH_PREFIX ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "bash -s -- \"$TARGET_DIR\"" << 'EOF'
            set -e
            TARGET_DIR="$1"
            cd "$TARGET_DIR"

            # Auto-detect PHP 8.4 or 8.3 CLI binary on Hostinger
            PHP_BIN="php"
            if [ $(php -r 'echo PHP_VERSION_ID;' 2>/dev/null || echo 0) -lt 80300 ]; then
              for candidate in \
                /opt/alt/php84/usr/bin/php \
                /opt/alt/php83/usr/bin/php \
                /usr/local/bin/ea-php84 \
                /usr/local/bin/ea-php83 \
                /usr/bin/php8.4 \
                /usr/bin/php8.3; do
                if command -v "$candidate" &> /dev/null; then
                  PHP_BIN="$candidate"
                  break
                fi
              done
            fi

            echo "=== Hostinger PHP CLI Version ==="
            $PHP_BIN -v

            echo "=== Ensuring Storage and Cache Directories ==="
            mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/framework/testing
            mkdir -p storage/logs storage/app/public storage/app/private storage/app/backups bootstrap/cache
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true

            # Ensure sqlite file exists if using sqlite database
            mkdir -p database
            touch database/database.sqlite 2>/dev/null || true

            if [ ! -f .env ]; then
              if [ -f .env.example ]; then
                echo "Notice: .env not found on server, creating initial from .env.example..."
                cp .env.example .env
                $PHP_BIN artisan key:generate --force
              else
                echo "Warning: .env.example not found, creating basic .env..."
                echo "APP_NAME=Midad" > .env
                echo "APP_ENV=production" >> .env
                echo "APP_DEBUG=false" >> .env
                echo "DB_CONNECTION=sqlite" >> .env
                $PHP_BIN artisan key:generate --force
              fi
            fi

            echo "=== Storage Symlink ==="
            $PHP_BIN artisan storage:link || true

            echo "=== Database Migrations ==="
            $PHP_BIN artisan migrate --force || echo "⚠️ Warning: Migrations could not run. Verify database credentials in .env on server."

            echo "=== Database Seeders ==="
            $PHP_BIN artisan db:seed --force || echo "⚠️ Warning: Seeders could not run."

            echo "=== Clearing & Rebuilding Production Caches ==="
            $PHP_BIN artisan cache:clear || true
            $PHP_BIN artisan optimize:clear || true
            $PHP_BIN artisan optimize || {
              $PHP_BIN artisan config:cache || true
              $PHP_BIN artisan route:cache || true
              $PHP_BIN artisan view:cache || true
            }

            echo "=== Deployment to Hostinger Completed Successfully! ==="
          EOF
