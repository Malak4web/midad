      x-required-role: admin
      security: [{sessionCookie: []}]
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [general, discovery_credit], default: general}}
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Coupon'}
                  meta: {$ref: '#/components/schemas/AdminListMeta'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      tags: ['Admin: Coupons']
      operationId: adminCreateCoupon
      summary: Create a coupon
      description: 'Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: [], xsrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CouponInput'}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Coupon'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/coupons/{coupon}:
    parameters:
      - {name: coupon, in: path, required: true, schema: {type: integer}}
    put:
      tags: ['Admin: Coupons']
      operationId: adminUpdateCoupon
      summary: Replace a coupon
      description: 'Full replacement; the code must stay unique. Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: [], xsrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CouponInput'}
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Coupon'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: ['Admin: Coupons']
      operationId: adminDeleteCoupon
      summary: Delete a coupon (or deactivate it if it was used)
      description: 'A coupon with `used > 0` is deactivated, not deleted, to keep the history. Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: [], xsrfHeader: []}]
      responses:
        '204': {description: Deleted or deactivated.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}

  # ─────────────────────────────── Admin: Customers (admin only)
  /admin/customers:
    get:
      tags: ['Admin: Customers']
      operationId: adminListCustomers
      summary: Customer accounts (30 per page)
      description: '`spent` sums orders that are not cancelled or `pending_payment`. Only `role=customer` users are listed. Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: []}]
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 80}, description: 'Searches name, email and phone.'}
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CustomerRow'}
                  meta: {$ref: '#/components/schemas/AdminListMeta'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/customers/{user}:
    get:
      tags: ['Admin: Customers']
      operationId: adminGetCustomer
      summary: One account with addresses and orders
      description: 'Any user id resolves (staff/admin accounts too), not only customers. Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: []}]
      parameters:
        - {name: user, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/CustomerDetail'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ─────────────────────────────── Admin: Reports (admin only)
  /admin/reports:
    get:
      tags: ['Admin: Reports']
      operationId: adminReport
      summary: Sales report for a date range
      description: |
        Defaults to the last 30 days ending today. A range longer than 366 days is clamped to the 366 days before `to`. Counts only orders in
        `placed, confirmed, preparing, shipped, delivered`, by `created_at`. Role: **admin**. Rate limit: admin 300/min.
      x-required-role: admin
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Report'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/reports/orders.csv:
    get:
      tags: ['Admin: Reports']
      operationId: adminExportOrders
      summary: CSV export of orders in a range
      description: |
        Streamed download `midad-orders-{from}-{to}.csv` (UTF-8 with BOM for Excel). Includes **all** statuses, unlike the report.
        Arabic header row: رقم الطلب, التاريخ, الحالة, العميل, الموبايل, المحافظة, الدفع, حالة الدفع, المجموع الفرعي, الخصم, الشحن, الإجمالي.
        Money columns are EGP. "الخصم" is discount plus credit. Customer names are escaped against CSV formula injection.
        Same range rules as `/admin/reports`. Role: **admin**. Rate limit: admin 300/min.
      x-required-role: admin
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: CSV file.
          headers:
            Content-Disposition:
              schema: {type: string}
              example: attachment; filename=midad-orders-2026-09-18-2026-10-17.csv
          content:
            text/csv:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: midad-session
      description: Laravel session cookie (name derived from APP_NAME unless SESSION_COOKIE is set). Obtained via /auth/login or /auth/register.
    xsrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Value of the `XSRF-TOKEN` cookie from `GET /sanctum/csrf-cookie`. Required on every non-GET request from the SPA (stateful domain), signed in or not.
    paymobHmac:
      type: apiKey
      in: query
      name: hmac
      description: HMAC-SHA512 of the concatenated transaction fields, keyed with PAYMOB_HMAC_SECRET (see the webhook operation).

  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    OrderNumber:
      name: number
      in: path
      required: true
      description: Public order number.
      schema: {type: string}
    ProductId:
      name: product
      in: path
      required: true
      description: Product id (soft-deleted products return 404).
      schema: {type: integer}
    VariantId:
      name: variant
      in: path
      required: true
      schema: {type: integer}
    NoteFilter:
      name: note
      in: query
      description: Note slug.
      schema: {type: string, maxLength: 64}
    SizeFilter:
      name: size
      in: query
      description: Only products with an active variant of this size.
      schema: {type: integer, enum: [10, 30, 50, 100]}
    PriceMin:
      name: price_min
      in: query
      description: EGP, matched against active variant prices.
      schema: {type: number, minimum: 0, maximum: 100000}
    PriceMax:
      name: price_max
      in: query
      description: EGP.
      schema: {type: number, minimum: 0, maximum: 100000}
    ProductSort:
      name: sort
      in: query
      schema: {type: string, enum: [default, best, new, price_asc, price_desc], default: default}
    CatalogPerPage:
      name: per_page
      in: query
      schema: {type: integer, minimum: 1, maximum: 48, default: 24}
    ReportFrom:
      name: from
      in: query
      schema: {type: string, format: date}
    ReportTo:
      name: to
      in: query
      description: Must be on or after `from`. Defaults to today.
      schema: {type: string, format: date}

  responses:
    Unauthenticated:
      description: Not signed in.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: سجّل الدخول أولاً.}
    Forbidden:
      description: Signed in but the role gate (`can:staff` / `can:admin`) denied the request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: ليس لديك صلاحية لهذا الإجراء.}
    NotFound:
      description: Not found (also used for a wrong order/phone pair and for resources owned by someone else).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: غير موجود.}
    CsrfMismatch:
      description: Missing or expired XSRF token. Not localized; this is Laravel's default message.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: CSRF token mismatch.}
    ValidationFailed:
      description: Validation failed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ValidationError'}
    TooManyRequests:
      description: Rate limit exceeded. `Retry-After` gives the seconds to wait.
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: محاولات كثيرة. انتظر قليلاً ثم حاول مرة أخرى.}
    CartOk:
      description: The full cart, priced on the server. For guests it also sets or refreshes the `midad_cart` cookie when a cart exists.
      headers:
        Set-Cookie:
          schema: {type: string}
          description: '`midad_cart=<encrypted>; HttpOnly; SameSite=Lax; Max-Age=2592000` (guests only)'
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/Cart'}
    CartCreated:
      description: Line added; returns the full cart (and sets the guest cookie).
      headers:
        Set-Cookie:
          schema: {type: string}
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/Cart'}
    AdminOrderOk:
      description: The full admin view of the order.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/AdminOrder'}
    AdminProductOk:
      description: The full admin view of the product.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/AdminProduct'}
    AdminProductCreated:
      description: Created; returns the full admin view of the product.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/AdminProduct'}
    AdminCategoriesOk:
      description: All categories.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: {$ref: '#/components/schemas/AdminCategory'}
    AdminGovernoratesOk:
      description: All governorates.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: {$ref: '#/components/schemas/AdminGovernorate'}
    SettingsOk:
      description: Current settings.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/Settings'}
    AdminFinderOk:
      description: All finder questions.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: {$ref: '#/components/schemas/AdminFinderQuestion'}

  schemas:
    # ── primitives
    Money:
      type: number
      description: Egyptian pounds. Whole amounts are integers; otherwise rounded to 2 decimals. Stored internally as piasters.
      example: 450
    MoneyNullable:
      type: [number, 'null']
      description: Egyptian pounds, or null.
    PhoneInput:
      type: string
      description: Egyptian mobile number. Arabic-Indic digits, spaces, dashes and a +20 prefix are accepted, then normalized to `01[0125]XXXXXXXX` before checking.
      example: '01012345678'
    PasswordInput:
      type: string
      minLength: 8
      description: At least 8 characters, with at least one letter and one number. Needs a matching `password_confirmation`.
    OrderStatus:
      type: string
      enum: [pending_payment, placed, confirmed, preparing, shipped, delivered, cancelled, returned]
    PaymentStatus:
      type: string
      enum: [unpaid, pending, paid, failed, refunded]
    PaymentMethod:
      type: string
      enum: [cod, card, wallet]
    HexColor:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
    Message:
      type: object
      required: [message]
      properties:
        message: {type: string}

    # ── errors
    Error:
      type: object
      required: [message]
      properties:
        message: {type: string, description: 'Arabic, human-readable.'}
        errors:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: {type: string, const: راجع البيانات المكتوبة.}
        errors:
          type: object
          description: Field path (dot notation, e.g. `variants.0.price`) -> Arabic messages.
          additionalProperties:
            type: array
            items: {type: string}
      example:
        message: راجع البيانات المكتوبة.
        errors:
          phone: [اكتب رقم موبايل مصري صحيح من ١١ رقماً يبدأ بـ 01.]

    # ── pagination
    PaginationLinks:
      type: object
      properties:
        first: {type: [string, 'null']}
        last: {type: [string, 'null']}
        prev: {type: [string, 'null']}
        next: {type: [string, 'null']}
    PaginationMeta:
      type: object
      description: Laravel's standard resource pagination meta.
      properties:
        current_page: {type: integer}
        from: {type: [integer, 'null']}
        last_page: {type: integer}
        links:
          type: array
          items:
            type: object
            properties:
              url: {type: [string, 'null']}
              label: {type: string}
              active: {type: boolean}
        path: {type: string}
        per_page: {type: integer}
        to: {type: [integer, 'null']}
        total: {type: integer}
    AdminListMeta:
      type: object
      description: Admin lists use this compact meta instead of Laravel's resource pagination.
      required: [total, current_page, last_page]
      properties:
        total: {type: integer}
        current_page: {type: integer}
        last_page: {type: integer}

    # ── catalog
    Image:
      type: object
      properties:
        src: {type: string, example: /storage/products/12/abc-800.webp}
        srcset: {type: string, example: '/storage/products/12/abc-400.webp 400w, /storage/products/12/abc-800.webp 800w, /storage/products/12/abc-1600.webp 1600w'}
        alt: {type: string, example: عود ملكي}
    Variant:
      type: object
      description: An active size of a product.
      properties:
        ml: {type: integer, enum: [10, 30, 50, 100]}
        price: {$ref: '#/components/schemas/Money'}
        compareAt: {$ref: '#/components/schemas/MoneyNullable'}
        stock: {type: integer, description: 'Available units (stock minus reserved), never negative.'}
    Pyramid:
      type: [object, 'null']
      description: Note pyramid; null when no layer has been entered.
      properties:
        top: {type: array, items: {type: string}, example: [برغموت]}
        heart: {type: array, items: {type: string}, example: [ورد]}
        base: {type: array, items: {type: string}, example: [عود, عنبر]}
    Product:
      type: object
      description: Product card (ProductResource). Relation-backed fields are present whenever the relation is loaded, which every storefront endpoint does.
      required: [id, slug, name]
      properties:
        id: {type: integer}
        slug: {type: string, example: royal-oud}
        category: {type: string, description: Category slug., example: oriental}
        name: {type: string, example: عود ملكي}
        latin: {type: string, example: Royal Oud}
        inspiredBy: {type: [string, 'null'], example: Oud Wood}
        signature: {type: [string, 'null'], description: Signature note., example: عود}
        concentration: {type: [string, 'null'], example: EAU DE PARFUM}
        notes:
          type: array
          description: Key notes.
          items: {type: string}
          example: [عود, زعفران]
        variants:
          type: array
          items: {$ref: '#/components/schemas/Variant'}
        fromPrice: {$ref: '#/components/schemas/MoneyNullable'}
        image:
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            description: {type: [string, 'null']}
            pyramid: {$ref: '#/components/schemas/Pyramid'}
            images:
              type: array
              items: {$ref: '#/components/schemas/Image'}
    ProductPage:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Product'}
        links: {$ref: '#/components/schemas/PaginationLinks'}
        meta: {$ref: '#/components/schemas/PaginationMeta'}
    Category:
      type: object
      required: [slug, name]
      properties:
        slug: {type: string, example: oriental}
        name: {type: string, example: شرقي}
        latin: {type: [string, 'null'], example: Oriental}
        description: {type: [string, 'null']}
        count: {type: integer, description: Active products. Only on `GET /categories`.}
    Palette:
      type: object
      required: [bg, surface, fg, muted, accent]
      properties:
        bg: {$ref: '#/components/schemas/HexColor'}
        surface: {$ref: '#/components/schemas/HexColor'}
        fg: {$ref: '#/components/schemas/HexColor'}
        muted: {$ref: '#/components/schemas/HexColor'}
        accent: {$ref: '#/components/schemas/HexColor'}
      example: {bg: '#3B342C', surface: '#4A4137', fg: '#F2EADB', muted: '#CFC4B2', accent: '#D6B77E'}
    Texture:
      type: string
      enum: [plain, resin, petals, smoke]
    Ingredient:
      type: string
      enum: [vanilla, amber, lavender, cardamom, strawberry, blackberry, jasmine, musk, incense, tobacco, oud, resin]
    Spotlight:
      type: object
      description: A category's featured product and its visual identity (SpotlightResource).
      properties:
        sample: {type: boolean, description: True for seeded placeholder spotlights.}
        tagline: {type: string, example: دفء الشرق في قطرة}
        palette: {$ref: '#/components/schemas/Palette'}
        texture: {$ref: '#/components/schemas/Texture'}
        ingredients:
          type: array
          maxItems: 4
          items: {$ref: '#/components/schemas/Ingredient'}
        sceneImage: {type: [string, 'null']}
        bottleImage: {type: [string, 'null']}
        pyramid: {$ref: '#/components/schemas/Pyramid'}
        product: {$ref: '#/components/schemas/Product'}
    HomeSection:
      type: object
      properties:
        category: {$ref: '#/components/schemas/Category'}
        spotlight:
          oneOf:
            - $ref: '#/components/schemas/Spotlight'
            - type: 'null'
        palette: {$ref: '#/components/schemas/Palette'}
        others:
          type: array
          description: The category's other active products (the spotlight product excluded).
          items: {$ref: '#/components/schemas/Product'}
    Home:
      type: object
      properties:
        announcements:
          type: array
          items: {type: string}
          example: [شحن مجاني فوق ١٠٠٠ ج.م]
        discovery:
          type: object
          properties:
            price: {$ref: '#/components/schemas/Money'}
            samples: {type: integer, default: 6}
            sampleMl: {type: integer, default: 2}
        sections:
          type: array
          items: {$ref: '#/components/schemas/HomeSection'}
    Note:
      type: object
      properties:
        slug: {type: string}
        name: {type: string, example: عنبر}
        count: {type: integer}
    FinderQuestion:
      type: object
      properties:
        key: {type: string, example: mood}
        q: {type: string, example: أي إحساس تبحث عنه؟}
        options:
          type: array
          items:
            type: object
            properties:
              v: {type: string, example: warm}
              label: {type: string, example: دافئ}
    FinderResult:
      type: object
      properties:
        product: {$ref: '#/components/schemas/Product'}
        why:
          type: array
          maxItems: 2
          description: Names of the notes or categories that matched.
          items: {type: string}
    Governorate:
      type: object
      properties:
        id: {type: integer}
        name: {type: string, example: القاهرة}
        fee: {$ref: '#/components/schemas/Money'}
        days:
          type: array
          description: '[min, max] delivery days.'
          minItems: 2
          maxItems: 2
          items: {type: integer}
          example: [2, 4]

    # ── auth
    User:
      type: object
      properties:
        id: {type: integer}
        name: {type: string, example: سارة أحمد}
        email: {type: string, format: email}
        phone: {type: [string, 'null'], example: '01012345678'}
        role: {type: string, enum: [customer, staff, admin]}
        emailVerified: {type: boolean}

    # ── cart
    CartItem:
      oneOf:
        - $ref: '#/components/schemas/CartProductItem'
        - $ref: '#/components/schemas/CartDiscoveryItem'
      discriminator:
        propertyName: kind
        mapping:
          product: '#/components/schemas/CartProductItem'
          discovery_box: '#/components/schemas/CartDiscoveryItem'
    CartItemBase:
      type: object
      required: [id, kind, quantity, unitPrice, lineTotal, available]
      properties:
        id: {type: integer}
        kind: {type: string, enum: [product, discovery_box]}
        quantity: {type: integer}
        unitPrice: {$ref: '#/components/schemas/Money'}
        lineTotal: {$ref: '#/components/schemas/Money'}
        available: {type: boolean, description: False if the size was deactivated or stock is below the quantity. Unavailable product lines price at 0.}
    CartProductItem:
      allOf:
        - $ref: '#/components/schemas/CartItemBase'
        - type: object
          properties:
            kind: {const: product}
            name: {type: [string, 'null'], example: عود ملكي}
            latin: {type: [string, 'null']}
            slug: {type: [string, 'null']}
            ml: {type: [integer, 'null']}
            stock: {type: integer, description: Available units.}
    CartDiscoveryItem:
      allOf:
        - $ref: '#/components/schemas/CartItemBase'
        - type: object
          properties:
            kind: {const: discovery_box}
            name: {type: string, const: مجموعة الاكتشاف}
            samples:
              type: array
              items: {type: string}
    Cart:
      type: object
      required: [items, count, coupon, gift, summary]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CartItem'}
        count: {type: integer, description: Sum of quantities.}
        coupon:
          type: [object, 'null']
          properties:
            code: {type: string}
            label: {type: string, example: خصم 10٪}
            problem: {type: [string, 'null'], description: Why the attached coupon currently doesn't apply.}
        gift:
          type: object
          properties:
            wrap: {type: boolean}
            recipient: {type: [string, 'null']}
            message: {type: [string, 'null']}
        summary:
          type: object
          properties:
            subtotal: {$ref: '#/components/schemas/Money'}
            discount: {$ref: '#/components/schemas/Money'}
            credit: {$ref: '#/components/schemas/Money'}
            shipping: {type: [number, 'null'], description: EGP; null until a governorate is known.}
            gift: {$ref: '#/components/schemas/Money'}
            total: {$ref: '#/components/schemas/Money'}
            freeShippingRemaining: {type: [number, 'null'], description: EGP left to reach free shipping.}

    # ── orders
    CheckoutResult:
      type: object
      required: [number, phone, status]
      properties:
        number: {type: string}
        phone: {type: string, description: Normalized phone; guests need it to view the order.}
        status: {type: string, enum: [placed, pending_payment]}
        redirectUrl: {type: [string, 'null'], description: Payment page for card/wallet; null for COD.}
    ShippingAddress:
      type: object
      properties:
        governorate: {type: string, example: الجيزة}
        city: {type: string}
        street: {type: string}
        building: {type: [string, 'null']}
        floor: {type: [string, 'null']}
        apartment: {type: [string, 'null']}
        landmark: {type: [string, 'null']}
    OrderItem:
      type: object
      properties:
        kind: {type: string, enum: [product, discovery_box]}
        name: {type: string}
        ml: {type: [integer, 'null']}
        quantity: {type: integer}
        unitPrice: {$ref: '#/components/schemas/Money'}
        lineTotal: {$ref: '#/components/schemas/Money'}
        samples:
          type: array
          items: {type: string}
    OrderTotals:
      type: object
      properties:
        subtotal: {$ref: '#/components/schemas/Money'}
        discount: {$ref: '#/components/schemas/Money'}
        credit: {$ref: '#/components/schemas/Money'}
        shipping: {$ref: '#/components/schemas/Money'}
        gift: {$ref: '#/components/schemas/Money'}
        total: {$ref: '#/components/schemas/Money'}
    OrderHistoryEntry:
      type: object
      properties:
        status: {$ref: '#/components/schemas/OrderStatus'}
        label: {type: string, example: تم الشحن}
        at: {type: [string, 'null'], format: date-time}
    Order:
      type: object
      description: OrderResource. `items`, `gift` and `history` appear only when loaded (all three on `GET /orders/{number}`; only `items` on `/account/orders`).
      properties:
        number: {type: string}
        status: {$ref: '#/components/schemas/OrderStatus'}
        statusLabel: {type: string, example: تم استلام الطلب}
        paymentMethod: {$ref: '#/components/schemas/PaymentMethod'}
        paymentStatus: {$ref: '#/components/schemas/PaymentStatus'}
        canRetryPayment: {type: boolean}
        reservedUntil: {type: [string, 'null'], format: date-time}
        customerName: {type: string}
        phone: {type: string}
        shippingAddress: {$ref: '#/components/schemas/ShippingAddress'}
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderItem'}
        gift:
          type: [object, 'null']
          properties:
            recipient: {type: [string, 'null']}
            message: {type: [string, 'null']}
        totals: {$ref: '#/components/schemas/OrderTotals'}
        couponCode: {type: [string, 'null']}
        history:
          type: array
          items: {$ref: '#/components/schemas/OrderHistoryEntry'}
        placedAt: {type: [string, 'null'], format: date-time}
    PaymobTransaction:
      type: object
      description: The `obj` of a Paymob TRANSACTION callback (only the fields used are listed).
      additionalProperties: true
      properties:
        id: {type: integer}
        amount_cents: {type: integer, description: Piasters; must equal the stored payment amount.}
        created_at: {type: string}
        currency: {type: string, example: EGP}
        error_occured: {type: boolean}
        has_parent_transaction: {type: boolean}
        integration_id: {type: integer}
        is_3d_secure: {type: boolean}
        is_auth: {type: boolean}
        is_capture: {type: boolean}
        is_refunded: {type: boolean}
        is_standalone_payment: {type: boolean}
        is_voided: {type: boolean}
        owner: {type: integer}
        pending: {type: boolean}
        success: {type: boolean}
        order:
          type: object
          properties:
            id: {type: integer}
            merchant_order_id: {type: string, description: Midad gateway reference.}
        source_data:
          type: object
          properties:
            pan: {type: string}
            sub_type: {type: string}
            type: {type: string}

    # ── account
    AddressInput:
      type: object
      required: [governorate_id, recipient_name, phone, city, street]
      properties:
        governorate_id: {type: integer}
        recipient_name: {type: string, maxLength: 120}
        phone: {$ref: '#/components/schemas/PhoneInput'}
        city: {type: string, maxLength: 80}
        street: {type: string, maxLength: 160}
        building: {type: [string, 'null'], maxLength: 40}
        floor: {type: [string, 'null'], maxLength: 20}
        apartment: {type: [string, 'null'], maxLength: 20}
        landmark: {type: [string, 'null'], maxLength: 160}
        is_default: {type: boolean}
    Address:
      type: object
      description: |
        A raw Eloquent model (no Resource): snake_case keys, timestamps, and the nested raw Governorate model.
        Unlike every other endpoint, its money field is in **piasters** (`governorate.shipping_fee_piasters`).
      properties:
        id: {type: integer}
        user_id: {type: integer}
        governorate_id: {type: integer}
        recipient_name: {type: string}
        phone: {type: string}
        city: {type: string}
        street: {type: string}
        building: {type: [string, 'null']}
        floor: {type: [string, 'null']}
        apartment: {type: [string, 'null']}
        landmark: {type: [string, 'null']}
        is_default: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        governorate:
          type: object
          properties:
            id: {type: integer}
            name: {type: string}
            shipping_fee_piasters: {type: integer}
            delivery_days_min: {type: integer}
            delivery_days_max: {type: integer}
            is_active: {type: boolean}
            sort: {type: integer}
            created_at: {type: [string, 'null'], format: date-time}
            updated_at: {type: [string, 'null'], format: date-time}

    # ── admin: dashboard & reports
    Dashboard:
      type: object
      properties:
        today:
          type: object
          properties:
            orders: {type: integer}
            sales: {$ref: '#/components/schemas/Money'}
        week:
          type: object
          properties:
            orders: {type: integer}
            sales: {$ref: '#/components/schemas/Money'}
        toConfirm: {type: integer, description: Orders in `placed`.}
        toShip: {type: integer, description: Orders in `confirmed` or `preparing`.}
        awaitingPayment: {type: integer}
        lowStock: {type: integer}
        latest:
          type: array
          maxItems: 8
          items:
            type: object
            properties:
              number: {type: string}
              customer: {type: string}
              status: {$ref: '#/components/schemas/OrderStatus'}
              total: {$ref: '#/components/schemas/Money'}
              at: {type: string, format: date-time}
        activity:
          type: array
          maxItems: 8
          items:
            type: object
            properties:
              who: {type: [string, 'null']}
              action: {type: string, example: POST api/admin/orders/MD-1001/status}
              at: {type: string, format: date-time}
    Report:
      type: object
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        totals:
          type: object
          properties:
            orders: {type: integer}
            sales: {$ref: '#/components/schemas/Money'}
            average: {$ref: '#/components/schemas/Money'}
        daily:
          type: array
          description: One entry per day in the range, zero-filled.
          items:
            type: object
            properties:
              date: {type: string, format: date}
              orders: {type: integer}
              sales: {$ref: '#/components/schemas/Money'}
        topProducts:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              name: {type: string}
              ml: {type: integer}
              qty: {type: integer}
              total: {$ref: '#/components/schemas/Money'}
        governorates:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              orders: {type: integer}
              sales: {$ref: '#/components/schemas/Money'}
        paymentMethods:
          type: array
          items:
            type: object
            properties:
              method: {$ref: '#/components/schemas/PaymentMethod'}
              orders: {type: integer}
              sales: {$ref: '#/components/schemas/Money'}

    # ── admin: orders
    AdminOrderRow:
      type: object
      properties:
        number: {type: string}
        status: {$ref: '#/components/schemas/OrderStatus'}
        statusLabel: {type: string}
        customer: {type: string}
        phone: {type: string}
        governorate: {type: [string, 'null']}
        paymentMethod: {$ref: '#/components/schemas/PaymentMethod'}
        paymentStatus: {$ref: '#/components/schemas/PaymentStatus'}
        total: {$ref: '#/components/schemas/Money'}
        items: {type: integer, description: Number of order lines.}
        createdAt: {type: string, format: date-time}
    AdminOrder:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          properties:
            email: {type: [string, 'null']}
            customerNote: {type: [string, 'null']}
            internalNote: {type: [string, 'null']}
            allowed:
              type: array
              description: Statuses this order may move to next.
              items: {$ref: '#/components/schemas/OrderStatus'}
            payments:
              type: array
              items:
                type: object
                properties:
                  gateway: {type: string, enum: [paymob, fake]}
                  reference: {type: string}
                  transactionId: {type: [string, 'null']}
                  amount: {$ref: '#/components/schemas/Money'}
                  status: {type: string, enum: [pending, paid, failed, refunded]}
                  at: {type: [string, 'null'], format: date-time}
            history:
              type: array
              description: Replaces the base `history` with the actor and note.
              items:
                type: object
                properties:
                  status: {$ref: '#/components/schemas/OrderStatus'}
                  label: {type: string}
                  note: {type: [string, 'null']}
                  by: {type: [string, 'null']}
                  at: {type: [string, 'null'], format: date-time}
            account:
              type: [object, 'null']
              properties:
                id: {type: integer}
                name: {type: string}

    # ── admin: products
    AdminVariantRow:
      type: object
      properties:
        id: {type: integer}
        ml: {type: integer}
        price: {$ref: '#/components/schemas/Money'}
        stock: {type: integer}
        reserved: {type: integer}
        low: {type: boolean}
        active: {type: boolean}
    AdminProductRow:
      type: object
      properties:
        id: {type: integer}
        slug: {type: string}
        name: {type: string}
        latin: {type: string}
        inspiredBy: {type: [string, 'null']}
        category: {type: [string, 'null'], description: Category **name** (the storefront Product uses the slug).}
        categoryId: {type: integer}
        active: {type: boolean}
        soldCount: {type: integer}
        image: {type: [string, 'null'], description: '`/storage/...` URL of the first image (a plain string, unlike the storefront Image object).'}
        variants:
          type: array
          description: All variants, including inactive ones.
          items: {$ref: '#/components/schemas/AdminVariantRow'}
    AdminProduct:
      allOf:
        - $ref: '#/components/schemas/AdminProductRow'
        - type: object
          properties:
            description: {type: [string, 'null']}
            signature: {type: [string, 'null']}
            concentration: {type: [string, 'null']}
            sort: {type: integer}
            notes:
              type: array
              items: {type: string}
            pyramid:
              type: object
              description: Always an object here (empty arrays when unset).
              properties:
                top: {type: array, items: {type: string}}
                heart: {type: array, items: {type: string}}
                base: {type: array, items: {type: string}}
            images:
              type: array
              items:
                type: object
                properties:
                  id: {type: integer}
                  url: {type: string}
                  alt: {type: [string, 'null']}
            variants:
              type: array
              items:
                type: object
                properties:
                  id: {type: integer}
                  ml: {type: integer}
                  sku: {type: string, example: MD-ROYALOUD-50-X7K}
                  price: {$ref: '#/components/schemas/Money'}
                  compareAt: {$ref: '#/components/schemas/MoneyNullable'}
                  stock: {type: integer}
                  reserved: {type: integer}
                  available: {type: integer}
                  lowThreshold: {type: integer}
                  active: {type: boolean}
    AdminProductInput:
      type: object
      required: [category_id, name, latin_name, variants]
      properties:
        category_id: {type: integer}
        name: {type: string, maxLength: 120, example: عود ملكي}
        latin_name: {type: string, maxLength: 120, example: Royal Oud}
        inspired_by: {type: [string, 'null'], maxLength: 120}
        signature_note: {type: [string, 'null'], maxLength: 120}
        description: {type: [string, 'null'], maxLength: 3000}
        concentration: {type: [string, 'null'], maxLength: 32, default: EAU DE PARFUM}
        is_active: {type: boolean}
        sort: {type: [integer, 'null'], minimum: 0, maximum: 9999}
        variants:
          type: array
          minItems: 1
          maxItems: 4
          description: '`size_ml` values must be distinct.'
          items:
            type: object
            required: [size_ml, price]
            properties:
              size_ml: {type: integer, enum: [10, 30, 50, 100]}
              price: {type: number, minimum: 1, maximum: 100000, description: EGP.}
              compare_at: {type: [number, 'null'], maximum: 100000, description: EGP; must be greater than price.}
              stock: {type: [integer, 'null'], minimum: 0, maximum: 100000, description: Starting stock; only used when creating the product.}
              low_stock_threshold: {type: [integer, 'null'], minimum: 0, maximum: 1000, default: 5}
              is_active: {type: boolean, default: true}
        notes:
          type: array
          maxItems: 20
          description: Key notes by name; unknown notes are created.
          items: {type: string, maxLength: 64}
        pyramid:
          type: object
          properties:
            top: {type: array, maxItems: 8, items: {type: string, maxLength: 64}}
            heart: {type: array, maxItems: 8, items: {type: string, maxLength: 64}}
            base: {type: array, maxItems: 8, items: {type: string, maxLength: 64}}
    LowStockRow:
      type: object
      properties:
        variantId: {type: integer}
        product: {type: [string, 'null']}
        slug: {type: [string, 'null']}
        ml: {type: integer}
        available: {type: integer}
        threshold: {type: integer}
    StockMovement:
      type: object
      properties:
        change: {type: integer}
        reason: {type: string, description: 'restock | adjustment | damage | sale | ... (order-driven reasons are written by OrderStatusService).'}
        note: {type: [string, 'null']}
        orderId: {type: [integer, 'null']}
        at: {type: string, format: date-time}

    # ── admin: store
    AdminSpotlight:
      type: object
      properties:
        id: {type: integer}
        categoryId: {type: integer}
        productId: {type: integer}
        product: {type: [string, 'null'], description: Product name.}
        tagline: {type: string}
        palette: {$ref: '#/components/schemas/Palette'}
        texture: {$ref: '#/components/schemas/Texture'}
        ingredients:
          type: array
          items: {$ref: '#/components/schemas/Ingredient'}
        sample: {type: boolean}
        active: {type: boolean}
        startsAt: {type: [string, 'null'], format: date-time}
        endsAt: {type: [string, 'null'], format: date-time}
        pyramid: {$ref: '#/components/schemas/Pyramid'}
    SpotlightInput:
      type: object
      required: [category_id, product_id, tagline, palette, texture]
      properties:
        category_id: {type: integer}
        product_id: {type: integer, description: Must be a non-deleted product in `category_id`.}
        tagline: {type: string, maxLength: 200}
        palette: {$ref: '#/components/schemas/Palette'}
        texture: {$ref: '#/components/schemas/Texture'}
        ingredients:
          type: array
          maxItems: 4
          uniqueItems: true
          items: {$ref: '#/components/schemas/Ingredient'}
        is_active: {type: boolean}
        starts_at: {type: [string, 'null'], format: date}
        ends_at: {type: [string, 'null'], format: date, description: After starts_at.}
    AdminCategory:
      type: object
      properties:
        id: {type: integer}
        slug: {type: string}
        name: {type: string}
        latin: {type: [string, 'null']}
        description: {type: [string, 'null']}
        active: {type: boolean}
        sort: {type: integer}
        products: {type: integer, description: Count of all (non-deleted) products.}
        spotlights:
          type: array
          items: {$ref: '#/components/schemas/AdminSpotlight'}
    AdminGovernorate:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        fee: {$ref: '#/components/schemas/Money'}
        daysMin: {type: integer}
        daysMax: {type: integer}
        active: {type: boolean}
    Settings:
      type: object
      properties:
        announcements:
          type: array
          items: {type: string}
        freeShippingThreshold: {$ref: '#/components/schemas/Money'}
        discoveryPrice: {$ref: '#/components/schemas/Money'}
        discoveryCreditDays: {type: integer, default: 60}
        giftWrapFee: {$ref: '#/components/schemas/Money'}
        reservationMinutes: {type: integer, default: 30}
        whatsapp: {type: string, description: Empty string when unset.}
    AdminFinderQuestion:
      type: object
      properties:
        id: {type: integer}
        key: {type: string}
        question: {type: string}
        answers:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              value: {type: string}
              label: {type: string}
              categories:
                description: Category slug -> weight. Serialized as `[]` (an empty JSON array) when there are no category weights.
                oneOf:
                  - type: object
                    additionalProperties: {type: integer}
                  - type: array
                    maxItems: 0
              notes:
                type: array
                items: {type: string}

    # ── admin: coupons
    Coupon:
      type: object
      properties:
        id: {type: integer}
        code: {type: string, example: MIDAD10}
        type: {type: string, enum: [percent, fixed, free_shipping]}
        kind: {type: string, enum: [general, discovery_credit]}
        label: {type: string, example: خصم 10٪}
        value: {type: number, description: Whole percent for `percent`; EGP for `fixed`; 0 for `free_shipping`.}
        minSubtotal: {$ref: '#/components/schemas/Money'}
        maxDiscount: {$ref: '#/components/schemas/MoneyNullable'}
        usageLimit: {type: [integer, 'null']}
        perCustomerLimit: {type: [integer, 'null']}
        used: {type: integer}
        discountGiven: {$ref: '#/components/schemas/Money'}
        phone: {type: [string, 'null'], description: Bound phone (discovery credits).}
        startsAt: {type: [string, 'null'], format: date}
        endsAt: {type: [string, 'null'], format: date}
        active: {type: boolean}
    CouponInput:
      type: object
      required: [code, type]
      properties:
        code: {type: string, maxLength: 40, pattern: '^[A-Za-z0-9_-]+$', description: Unique; stored uppercase.}
        type: {type: string, enum: [percent, fixed, free_shipping]}
        value: {type: [number, 'null'], minimum: 0, description: 'Required unless free_shipping. Percent: max 90 (truncated to an integer). Fixed: EGP, max 100000.'}
        min_subtotal: {type: [number, 'null'], minimum: 0, description: EGP.}
        max_discount: {type: [number, 'null'], minimum: 0, description: EGP.}
        usage_limit: {type: [integer, 'null'], minimum: 1}
        per_customer_limit: {type: [integer, 'null'], minimum: 1}
        starts_at: {type: [string, 'null'], format: date}
        ends_at: {type: [string, 'null'], format: date, description: After starts_at.}
        is_active: {type: boolean, default: true}

    # ── admin: customers
    CustomerRow:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        email: {type: string}
        phone: {type: [string, 'null']}
        orders: {type: integer}
        spent: {$ref: '#/components/schemas/Money'}
        joinedAt: {type: string, format: date}
    CustomerDetail:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        email: {type: string}
        phone: {type: [string, 'null']}
        joinedAt: {type: string, format: date}
        addresses:
          type: array
          description: One-line addresses.
          items: {type: string}
          example: [القاهرة، مدينة نصر، شارع عباس العقاد]
        orders:
          type: array
          items:
            type: object
            properties:
              number: {type: string}
              status: {type: string, description: 'The Arabic status **label**, not the status code.', example: تم التوصيل}
              total: {$ref: '#/components/schemas/Money'}
              at: {type: string, format: date}
