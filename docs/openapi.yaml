openapi: 3.1.0
info:
  title: Midad API
  version: 1.0.0
  summary: Storefront and admin JSON API for Midad, an Arabic-first perfume store in Egypt.
  description: |
    Hand-written reference for the Laravel backend (`backend/routes/api.php`). Every path below is
    relative to the `/api` server prefix.

    ## Authentication (Sanctum SPA cookies)
    The API is stateful (`$middleware->statefulApi()` in `bootstrap/app.php`); there are no bearer tokens.

    1. `GET /sanctum/csrf-cookie` (outside `/api`) sets the `XSRF-TOKEN` cookie.
    2. Every non-GET request from the SPA sends the cookie's value back in the `X-XSRF-TOKEN` header
       (axios does this automatically). A missing or stale token returns **419**.
    3. `POST /auth/login` or `POST /auth/register` starts the session (`midad-session` cookie, http-only,
       SameSite=Lax). Logging in or registering merges the guest cart into the account cart.

    Guests get a cart through an encrypted, http-only `midad_cart` cookie (30 days, SameSite=Lax) that holds
    an opaque cart token. Signed-in users' carts are tied to the account, and the cookie is cleared on login.

    ## Roles
    `customer`, `staff`, `admin`. Every `/admin/*` route requires `auth:sanctum` plus the `can:staff` gate
    (staff or admin). Operations marked **admin only** also pass the `can:admin` gate. Each admin operation carries
    an `x-required-role` extension (`staff` or `admin`). Successful admin writes are recorded in the
    admin activity log (`LogAdminActivity`).

    ## Money
    Storage is integer piasters (1 EGP = 100 piasters). The API speaks **Egyptian pounds** as JSON numbers
    (`App\Support\Money::egp`): whole amounts come out as integers (`450`), fractional ones rounded to
    2 decimals (`449.5`). Inputs are pounds too and are converted with `Money::piasters` (rounded to the piaster).
    The one exception is `GET/POST/PUT /account/addresses`, which return raw models (see the Address schema).

    ## Errors
    API errors are JSON `{message, errors?}` with Arabic messages (`bootstrap/app.php`):

    | Status | When | message |
    |---|---|---|
    | 401 | not signed in | `سجّل الدخول أولاً.` |
    | 403 | gate/policy denied | `ليس لديك صلاحية لهذا الإجراء.` |
    | 404 | model or route not found, or a wrong order/phone pair | `غير موجود.` |
    | 419 | CSRF token missing or expired. **Not localized**: Laravel's default `CSRF token mismatch.` | |
    | 422 | validation; `errors` maps field -> list of Arabic messages | `راجع البيانات المكتوبة.` |
    | 429 | rate limit hit | `محاولات كثيرة. انتظر قليلاً ثم حاول مرة أخرى.` |

    ## Rate limits
    Named throttles from `routes/api.php` and `AppServiceProvider`. Each limit is keyed by the signed-in user id,
    or by the client IP for guests, unless stated otherwise:
    catalog 120/min · search +60/min · finder result +30/min · cart 120/min · coupon +10/min ·
    login (5/min per email+IP **and** 20/min per IP) · auth-mail 3/min per email+IP · verify 6/min ·
    checkout `CHECKOUT_PER_MINUTE` (default 10)/min · order lookup 30/min · pay 10/min · sandbox 20/min · admin 300/min.

    ## Non-API routes (routes/web.php)
    `GET /sitemap.xml`, `GET /robots.txt`, and `GET /{path}` (the SPA HTML shell with per-page meta for every path
    except `api/`, `sanctum/`, `storage/`, `up`). `GET /up` is the health check. These are not JSON and are not described below.
servers:
  - url: /api
    description: API prefix (same origin as the SPA)
tags:
  - name: Catalog
    description: Public storefront catalog, search, finder quiz and shipping zones.
  - name: Auth
    description: Session auth, registration, password reset, email verification, profile.
  - name: Cart
    description: Server-priced cart for guests (cookie) or signed-in customers.
  - name: Checkout & Orders
    description: Placing orders and looking them up.
  - name: Payments
    description: Paymob callback and the local fake-gateway sandbox.
  - name: Account
    description: Signed-in customer's orders and saved addresses.
  - name: 'Admin: Products'
  - name: 'Admin: Orders'
  - name: 'Admin: Store'
    description: Categories, spotlights, shipping rates, settings and finder weights.
  - name: 'Admin: Coupons'
  - name: 'Admin: Customers'
  - name: 'Admin: Reports'

paths:
  # ─────────────────────────────── Sanctum (outside /api)
  /sanctum/csrf-cookie:
    servers:
      - url: /
        description: Site root (this route is not under /api)
    get:
      tags: [Auth]
      operationId: csrfCookie
      summary: Get the XSRF-TOKEN cookie
      description: Sanctum route. Sets the `XSRF-TOKEN` cookie (and the session cookie). Call it once before the first non-GET request.
      security: []
      responses:
        '204':
          description: Cookie set.
          headers:
            Set-Cookie:
              schema: {type: string}
              description: '`XSRF-TOKEN=...; midad-session=...`'

  # ─────────────────────────────── Catalog
  /home:
    get:
      tags: [Catalog]
      operationId: getHome
      summary: Home page payload
      description: |
        Announcements, discovery box pricing, and one section per active category (its spotlight, the palette, and the other products).
        Cached for 10 minutes and invalidated by admin writes. The same payload is embedded in the HTML shell of `/`.
        Rate limit: catalog 120/min.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Home'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: Active categories with product counts
      description: 'Rate limit: catalog 120/min.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Category'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /categories/{slug}:
    get:
      tags: [Catalog]
      operationId: getCategory
      summary: Products in one category (paginated, filterable)
      description: 'Takes the same filters as `GET /products` (the `category` query param is overridden by the path). Returns 404 for unknown or inactive categories. Rate limit: catalog 120/min.'
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
          example: oriental
        - $ref: '#/components/parameters/NoteFilter'
        - $ref: '#/components/parameters/SizeFilter'
        - $ref: '#/components/parameters/PriceMin'
        - $ref: '#/components/parameters/PriceMax'
        - $ref: '#/components/parameters/ProductSort'
        - $ref: '#/components/parameters/CatalogPerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK. Laravel resource pagination; `meta.category` is added to the paginator meta.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProductPage'
                  - type: object
                    properties:
                      meta:
                        type: object
                        properties:
                          category: {$ref: '#/components/schemas/Category'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: Browse active products (paginated, filterable)
      description: 'Filters come from `ProductQuery::rules()`. Price filters match any active variant within the range. Rate limit: catalog 120/min.'
      security: []
      parameters:
        - name: category
          in: query
          schema: {type: string, maxLength: 64}
          description: Category slug.
        - $ref: '#/components/parameters/NoteFilter'
        - $ref: '#/components/parameters/SizeFilter'
        - $ref: '#/components/parameters/PriceMin'
        - $ref: '#/components/parameters/PriceMax'
        - $ref: '#/components/parameters/ProductSort'
        - $ref: '#/components/parameters/CatalogPerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductPage'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /products/{slug}:
    get:
      tags: [Catalog]
      operationId: getProduct
      summary: Product detail with up to 4 similar products
      description: '"Similar" ranks other products by the most shared notes, then by same category. Rate limit: catalog 120/min.'
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/ProductDetail'}
                  meta:
                    type: object
                    properties:
                      similar:
                        type: array
                        maxItems: 4
                        items: {$ref: '#/components/schemas/Product'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /search:
    get:
      tags: [Catalog]
      operationId: searchProducts
      summary: Search products
      description: 'Arabic-normalized search over the Midad name, the Latin name, the original perfume, and the signature note (MySQL FULLTEXT plus a LIKE pass). Not paginated. Rate limits: catalog 120/min and search 60/min.'
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 80}
          example: عود
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 24, default: 24}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Product'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /notes:
    get:
      tags: [Catalog]
      operationId: listNotes
      summary: Fragrance notes used by at least one active product
      description: 'Sorted by product count (descending), then name. Rate limit: catalog 120/min.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Note'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /finder/questions:
    get:
      tags: [Catalog]
      operationId: listFinderQuestions
      summary: Scent finder quiz questions
      description: 'Rate limit: catalog 120/min.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/FinderQuestion'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /finder/result:
    post:
      tags: [Catalog]
      operationId: finderResult
      summary: Recommend products from quiz answers
      description: 'Rate limits: catalog 120/min and finder 30/min. Requires the X-XSRF-TOKEN header when called from the SPA.'
      security:
        - xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: object
                  description: Question key -> chosen option value (`v`). At most 10 entries.
                  maxProperties: 10
                  additionalProperties: {type: string, maxLength: 32}
                  example: {mood: warm, time: night}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/FinderResult'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /governorates:
    get:
      tags: [Catalog]
      operationId: listGovernorates
      summary: Active shipping governorates with fees and delivery days
      description: 'Rate limit: catalog 120/min.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Governorate'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────── Auth
  /auth/me:
    get:
      tags: [Auth]
      operationId: me
      summary: Current user (or null)
      description: Never returns 401. `data` is null for guests. No rate limit.
      security:
        - {}
        - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/User'
                      - type: 'null'

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create a customer account and sign in
      description: |
        Signs the new user in (remember-me on), regenerates the session, merges the guest cart into the account,
        clears the `midad_cart` cookie, and sends the verification email. Rate limit: login (5/min per email+IP, 20/min per IP).
      security:
        - xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, phone, password, password_confirmation]
              properties:
                name: {type: string, maxLength: 120, example: سارة أحمد}
                email: {type: string, format: email, maxLength: 190, description: 'RFC email, unique, stored lowercase.'}
                phone: {$ref: '#/components/schemas/PhoneInput'}
                password: {$ref: '#/components/schemas/PasswordInput'}
                password_confirmation: {type: string}
      responses:
        '201':
          description: Created and signed in.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in
      description: |
        Bad credentials return 422 with `errors.email = ["البريد الإلكتروني أو كلمة المرور غير صحيحة."]`.
        On success, regenerates the session, merges the guest cart, and clears `midad_cart`.
        Rate limit: login (5/min per email+IP, 20/min per IP).
      security:
        - xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
                remember: {type: boolean, default: true}
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out
      description: Invalidates the session and regenerates the CSRF token. No rate limit.
      security:
        - sessionCookie: []
          xsrfHeader: []
      responses:
        '204': {description: Signed out.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Send a password reset link
      description: |
        Returns the same answer whether or not the email exists, so accounts can't be enumerated. The emailed link points to
        `{FRONTEND_URL}/reset-password?token=...&email=...`. Rate limit: auth-mail (3/min per email+IP).
      security:
        - xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
              example: {message: أرسلنا رابط تغيير كلمة المرور إلى بريدك إن كان مسجلاً لدينا.}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: 'An invalid or expired token returns 422 with an `errors.email` message. Rate limit: login (5/min per email+IP, 20/min per IP).'
      security:
        - xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: {type: string}
                email: {type: string, format: email}
                password: {$ref: '#/components/schemas/PasswordInput'}
                password_confirmation: {type: string}
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
              example: {message: تم تغيير كلمة المرور.}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /auth/verify-email/{id}/{hash}:
    get:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm an email address (signed link)
      description: |
        A relative signed URL (`signed:relative`) valid for 24 hours. The email links to `{FRONTEND_URL}/verify-email?url=<this path>`, and the SPA calls it.
        `hash` is `sha1(email)`. A bad signature or hash returns 403 with a **non-localized** framework message (these are plain
        HttpExceptions, which the Arabic 403 renderer does not catch). Idempotent. Rate limit: verify 6/min.
      security: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: hash, in: path, required: true, schema: {type: string, pattern: '^[0-9a-f]{40}$'}}
        - {name: expires, in: query, required: true, schema: {type: integer}, description: Unix timestamp added by the signer.}
        - {name: signature, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Verified (or already verified).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
              example: {message: تم تأكيد بريدك الإلكتروني.}
        '403':
          description: Invalid or expired signature, or a hash mismatch. The message is not in Arabic.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {message: Invalid signature.}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /auth/verify-email/resend:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Resend the verification email
      description: 'No-op when already verified (same 200 response). Rate limit: auth-mail (3/min, keyed by the `email` input + IP; the body is usually empty, so effectively per IP).'
      security:
        - sessionCookie: []
          xsrfHeader: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
              example: {message: أرسلنا رابط التأكيد إلى بريدك.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /auth/profile:
    patch:
      tags: [Auth]
      operationId: updateProfile
      summary: Update name, phone, or password
      description: All fields are optional. Changing `password` requires `current_password` (checked against the session user) and `password_confirmation`. No rate limit.
      security:
        - sessionCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, maxLength: 120}
                phone: {$ref: '#/components/schemas/PhoneInput'}
                current_password: {type: string, description: Required with `password`.}
                password: {$ref: '#/components/schemas/PasswordInput'}
                password_confirmation: {type: string}
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  # ─────────────────────────────── Cart
  /cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: Current cart, priced on the server
      description: |
        Resolves the cart from the session user or the `midad_cart` cookie. Returns an empty cart if neither exists (no cart is created).
        Pass `governorate_id` to get a shipping quote. Rate limit: cart 120/min.
      security:
        - {}
        - sessionCookie: []
      parameters:
        - name: governorate_id
          in: query
          schema: {type: integer}
          description: Must exist in governorates.
      responses:
        '200': {$ref: '#/components/responses/CartOk'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /cart/items:
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: Add a product size to the cart
      description: |
        Creates the cart if needed (and sets the `midad_cart` cookie for guests). Adding an existing line increases its quantity, capped at 10.
        Stock is checked against available stock (stock minus reserved). Errors: `errors.size_ml` (size unavailable), `errors.quantity` (out of stock or over the limit).
        Rate limit: cart 120/min.
      security:
        - xsrfHeader: []
        - sessionCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, size_ml]
              properties:
                slug: {type: string, maxLength: 120}
                size_ml: {type: integer, enum: [10, 30, 50, 100]}
                quantity: {type: integer, minimum: 1, maximum: 10, default: 1}
      responses:
        '201': {$ref: '#/components/responses/CartCreated'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /cart/discovery-box:
    post:
      tags: [Cart]
      operationId: addDiscoveryBox
      summary: Add a discovery box (sample set)
      description: |
        `product_ids` must contain exactly `discovery_box.samples` (default 6) distinct active products. At most 3 boxes per cart,
        counted when adding. Errors go to `errors.product_ids`. Rate limit: cart 120/min.
      security:
        - xsrfHeader: []
        - sessionCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_ids]
              properties:
                product_ids:
                  type: array
                  maxItems: 12
                  items: {type: integer}
                  example: [1, 4, 7, 9, 12, 15]
      responses:
        '201': {$ref: '#/components/responses/CartCreated'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /cart/items/{item}:
    parameters:
      - name: item
        in: path
        required: true
        description: Cart line id (`items[].id`). Numeric only.
        schema: {type: integer}
    patch:
      tags: [Cart]
      operationId: updateCartItem
      summary: Change a line's quantity (0 removes it)
      description: Product lines are capped at 10 and checked against stock. Discovery box lines are capped at 3. Returns 404 if the line is not in the caller's cart. Rate limit cart 120/min.
      security:
        - xsrfHeader: []
        - sessionCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: {type: integer, minimum: 0, maximum: 10}
      responses:
        '200': {$ref: '#/components/responses/CartOk'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: Remove a line
      description: 'Rate limit: cart 120/min.'
      security:
        - xsrfHeader: []
        - sessionCookie: []
          xsrfHeader: []
      responses:
        '200': {$ref: '#/components/responses/CartOk'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /cart/coupon:
    post:
      tags: [Cart]
      operationId: applyCoupon
      summary: Apply a coupon code
      description: |
        Codes are case-insensitive. An unknown code returns `errors.code = ["كود الخصم غير صحيح."]`. Other problems (expired,
        minimum subtotal, per-customer limit, a phone-bound discovery credit) also land in `errors.code`. A coupon that
        stops qualifying later stays attached, and `coupon.problem` explains why. Rate limits: cart 120/min and coupon 10/min.
      security:
        - xsrfHeader: []
        - sessionCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, maxLength: 40, example: MIDAD10}
      responses:
        '200': {$ref: '#/components/responses/CartOk'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    delete:
      tags: [Cart]
      operationId: removeCoupon
      summary: Remove the coupon
      description: 'Rate limit: cart 120/min.'
      security:
        - xsrfHeader: []
        - sessionCookie: []
          xsrfHeader: []
      responses:
        '200': {$ref: '#/components/responses/CartOk'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /cart/gift:
    put:
      tags: [Cart]
      operationId: setGift
      summary: Gift wrap, recipient and message
      description: 'HTML is stripped and text trimmed. When `wrap` is false, recipient and message are cleared. Rate limit: cart 120/min.'
      security:
        - xsrfHeader: []
        - sessionCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wrap]
              properties:
                wrap: {type: boolean}
                recipient: {type: [string, 'null'], maxLength: 60, example: نور}
                message: {type: [string, 'null'], maxLength: 120, example: كل سنة وانتِ طيبة}
      responses:
        '200': {$ref: '#/components/responses/CartOk'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────── Checkout & Orders
  /checkout:
    post:
      tags: [Checkout & Orders]
      operationId: checkout
      summary: Place an order from the current cart
      description: |
        Guests or customers. Prices are recomputed on the server, and stock is reserved. `cod` orders start as `placed`.
        `card`/`wallet` orders start as `pending_payment` with a reservation window, and `redirectUrl` points to the payment page
        (Paymob, or the local sandbox with the fake driver). An empty cart returns `errors.cart`; a stock or coupon problem returns `errors.cart` / `errors.code`.
        Keep `number` and `phone`: guests need both to look the order up.
        Rate limit: checkout `CHECKOUT_PER_MINUTE` (default 10)/min per user or IP.
      security:
        - xsrfHeader: []
        - sessionCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_name, phone, governorate_id, city, street, payment_method]
              properties:
                customer_name: {type: string, maxLength: 120, example: محمد علي}
                phone: {$ref: '#/components/schemas/PhoneInput'}
                email: {type: [string, 'null'], format: email, maxLength: 190, description: Defaults to the account email.}
                governorate_id: {type: integer, description: Must exist in governorates.}
                city: {type: string, maxLength: 80, example: مدينة نصر}
                street: {type: string, maxLength: 160, example: شارع عباس العقاد}
                building: {type: [string, 'null'], maxLength: 40}
                floor: {type: [string, 'null'], maxLength: 20}
                apartment: {type: [string, 'null'], maxLength: 20}
                landmark: {type: [string, 'null'], maxLength: 160}
                note: {type: [string, 'null'], maxLength: 500}
                payment_method: {$ref: '#/components/schemas/PaymentMethod'}
      responses:
        '201':
          description: Order placed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/CheckoutResult'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /orders/{number}:
    get:
      tags: [Checkout & Orders]
      operationId: getOrder
      summary: Order page / tracking
      description: |
        The owner (session user) needs nothing else. Everyone else must pass the `phone` used on the order. It is normalized, so
        `+20 10 1234 5678` and Arabic-Indic digits match. A wrong number/phone pair returns **404** (not 403) to avoid leaking which order numbers exist.
        Rate limit: orders 30/min.
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
        - name: phone
          in: query
          schema: {type: string}
          description: Required for guests (or for any user who doesn't own the order).
          example: '01012345678'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Order'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /orders/{number}/pay:
    post:
      tags: [Payments]
      operationId: retryPayment
      summary: Start a new payment attempt for a pending online order
      description: |
        Same ownership rule as `GET /orders/{number}` (owner, or `phone` in the body). Only allowed while the order is `pending_payment`,
        unpaid, and `reservedUntil` is in the future; otherwise returns 422 `errors.order`. Creates a new pending payment.
        Rate limit: pay 10/min.
      security:
        - xsrfHeader: []
        - sessionCookie: []
          xsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: {type: string, description: Required for guests.}
      responses:
        '200':
          description: Redirect the browser to `redirectUrl`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [redirectUrl]
                    properties:
                      redirectUrl: {type: string, format: uri-reference}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────── Payments
  /payments/paymob/webhook:
    post:
      tags: [Payments]
      operationId: paymobWebhook
      summary: Paymob "transaction processed" callback
      description: |
        Server-to-server, so no session or CSRF (Paymob's host is not a stateful domain). Authenticated by HMAC: the `hmac` query parameter must equal
        `HMAC-SHA512(PAYMOB_HMAC_SECRET, concat(fields))` (hex, compared case-insensitively). The fields are read from `obj`, in this order:
        `amount_cents, created_at, currency, error_occured, has_parent_transaction, id, integration_id, is_3d_secure, is_auth,
        is_capture, is_refunded, is_standalone_payment, is_voided, order.id, owner, pending, source_data.pan,
        source_data.sub_type, source_data.type, success`. Booleans are concatenated as `true`/`false`.

        Idempotent per transaction id. The payment is matched by `obj.order.merchant_order_id` (the gateway reference). The order becomes
        `paid` only when `success === true`, `pending === false`, and `amount_cents` equals the stored amount; then it moves to `placed`.
        Not rate limited.
      security:
        - paymobHmac: []
      parameters:
        - name: hmac
          in: query
          required: true
          schema: {type: string, pattern: '^[0-9a-fA-F]{128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: {type: string, example: TRANSACTION}
                obj: {$ref: '#/components/schemas/PaymobTransaction'}
      responses:
        '200':
          description: Signature valid (processed, or ignored as a duplicate/unknown reference).
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: {type: boolean, const: true}
        '400':
          description: Bad or missing HMAC.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: {type: boolean, const: false}

  /payments/sandbox/{reference}:
    parameters:
      - name: reference
        in: path
        required: true
        schema: {type: string}
        description: Gateway reference, `{orderNumber}-{6 chars}`.
        example: MD-240117-AB12-X7K2QZ
    get:
      tags: [Payments]
      operationId: getSandboxPayment
      summary: Fake gateway payment page data
      description: Only when `PAYMENT_DRIVER=fake`; otherwise 404. Stands in for the Paymob page in development. Not rate limited.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      reference: {type: string}
                      status: {type: string, enum: [pending, paid, failed, refunded]}
                      amount: {$ref: '#/components/schemas/Money'}
                      orderNumber: {type: string}
                      phone: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Payments]
      operationId: completeSandboxPayment
      summary: Simulate a gateway result
      description: Only when `PAYMENT_DRIVER=fake` and the app is not in production; otherwise 404. Builds a signed fake transaction and runs it through the same callback handler as the webhook. Rate limit sandbox 20/min.
      security:
        - xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: {type: string, enum: [success, fail]}
      responses:
        '200':
          description: Processed. The SPA then shows the order with this number and phone.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      orderNumber: {type: string}
                      phone: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────── Account
  /account/orders:
    get:
      tags: [Account]
      operationId: listMyOrders
      summary: My orders (10 per page, newest first)
      description: Order resources with `items` loaded (sample names are not loaded here, so `items[].samples` is always `[]`). `gift` and `history` are omitted. No rate limit.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Order'}
                  links: {$ref: '#/components/schemas/PaginationLinks'}
                  meta: {$ref: '#/components/schemas/PaginationMeta'}
        '401': {$ref: '#/components/responses/Unauthenticated'}

  /account/addresses:
    get:
      tags: [Account]
      operationId: listAddresses
      summary: Saved addresses (default first)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Address'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    post:
      tags: [Account]
      operationId: createAddress
      summary: Save an address
      description: If `is_default` is true, or this is the user's only address, it becomes the default and the others are cleared.
      security:
        - sessionCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddressInput'}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Address'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /account/addresses/{address}:
    parameters:
      - name: address
        in: path
        required: true
        schema: {type: integer}
    put:
      tags: [Account]
      operationId: updateAddress
      summary: Replace an address
      description: Full replacement (same rules as create). Another user's address returns 404.
      security:
        - sessionCookie: []
          xsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddressInput'}
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Address'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Account]
      operationId: deleteAddress
      summary: Delete an address
      security:
        - sessionCookie: []
          xsrfHeader: []
      responses:
        '204': {description: Deleted.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}

  # ─────────────────────────────── Admin: Reports (dashboard is staff)
  /admin/dashboard:
    get:
      tags: ['Admin: Reports']
      operationId: adminDashboard
      summary: Dashboard tiles
      description: |
        "Sales" counts orders in `placed, confirmed, preparing, shipped, delivered`, by `created_at`. `week` covers today plus the previous 6 days.
        Role: staff. Rate limit: admin 300/min.
      x-required-role: staff
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Dashboard'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ─────────────────────────────── Admin: Orders
  /admin/orders:
    get:
      tags: ['Admin: Orders']
      operationId: adminListOrders
      summary: Orders desk (25 per page)
      description: '`q` matches the order number (case-insensitive), phone, or customer name. `from`/`to` filter `created_at` by date. `meta.counts` gives all-time counts per status. Role: staff. Rate limit: admin 300/min.'
      x-required-role: staff
      security: [{sessionCookie: []}]
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/OrderStatus'}}
        - {name: payment_status, in: query, schema: {$ref: '#/components/schemas/PaymentStatus'}}
        - {name: payment_method, in: query, schema: {$ref: '#/components/schemas/PaymentMethod'}}
        - {name: governorate_id, in: query, schema: {type: integer}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: q, in: query, schema: {type: string, maxLength: 60}}
        - {name: page, in: query, schema: {type: integer}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/AdminOrderRow'}
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/AdminListMeta'
                      - type: object
                        properties:
                          counts:
                            type: object
                            description: Status -> number of orders (statuses with no orders are absent).
                            additionalProperties: {type: integer}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /admin/orders/{number}:
    get:
      tags: ['Admin: Orders']
      operationId: adminGetOrder
      summary: Full order (with payments, history, allowed transitions)
      description: 'Bound by order number. Role: staff. Rate limit: admin 300/min.'
      x-required-role: staff
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      responses:
        '200': {$ref: '#/components/responses/AdminOrderOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /admin/orders/{number}/status:
    post:
      tags: ['Admin: Orders']
      operationId: adminTransitionOrder
      summary: Move an order to another status
      description: |
        Allowed transitions (`Order::TRANSITIONS`): pending_payment -> placed|cancelled; placed -> confirmed|cancelled;
        confirmed -> preparing|cancelled; preparing -> shipped|cancelled; shipped -> delivered|returned; delivered -> returned.
        Anything else returns 422 `errors.status`. Confirming turns the reservation into a sale. Cancelling releases the reservation, or restocks if the order was already sold.
        Returning restocks. Role: staff. Rate limit: admin 300/min.
      x-required-role: staff
      security: [{sessionCookie: [], xsrfHeader: []}]
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {$ref: '#/components/schemas/OrderStatus'}
                note: {type: [string, 'null'], maxLength: 255}
      responses:
        '200': {$ref: '#/components/responses/AdminOrderOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /admin/orders/{number}/note:
    put:
      tags: ['Admin: Orders']
      operationId: adminOrderNote
      summary: Set the internal (staff-only) note
      description: 'Send `internal_note` explicitly (null clears it); omitting the key is a 422. Role: staff. Rate limit: admin 300/min.'
      x-required-role: staff
      security: [{sessionCookie: [], xsrfHeader: []}]
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [internal_note]
              properties:
                internal_note: {type: [string, 'null'], maxLength: 2000}
      responses:
        '200': {$ref: '#/components/responses/AdminOrderOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /admin/orders/{number}/refund:
    post:
      tags: ['Admin: Orders']
      operationId: adminRefundOrder
      summary: Record a manual refund (admin only)
      description: |
        Bookkeeping only: the money goes back through Paymob's dashboard. Marks the latest paid payment and the order as `refunded`,
        and adds a history entry `استرداد: <note>`. Returns 422 `errors.refund` if there is no completed online payment. Role: **admin**. Rate limit: admin 300/min.
      x-required-role: admin
      security: [{sessionCookie: [], xsrfHeader: []}]
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: {type: string, maxLength: 255}
      responses:
        '200': {$ref: '#/components/responses/AdminOrderOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /admin/orders/{number}/waybill:
    get:
      tags: ['Admin: Orders']
      operationId: adminOrderWaybill
      summary: Printable waybill (HTML)
      description: 'Plain HTML rendered from `resources/views/admin/waybill.blade.php`, for the browser to print. Role: staff. Rate limit: admin 300/min.'
      x-required-role: staff
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      responses:
        '200':
          description: HTML page.
          content:
            text/html:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ─────────────────────────────── Admin: Products
  /admin/products:
    get:
      tags: ['Admin: Products']
      operationId: adminListProducts
      summary: Products (non-deleted, active and inactive)
      description: '`status=low` matches products with any variant at or below its low-stock threshold (stock minus reserved). `q` searches the name, the Latin name, and the original perfume. Role: staff. Rate limit: admin 300/min.'
      x-required-role: staff
      security: [{sessionCookie: []}]
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 80}}
        - {name: category_id, in: query, schema: {type: integer}}
        - {name: status, in: query, schema: {type: string, enum: [active, inactive, low]}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/AdminProductRow'}
                  meta: {$ref: '#/components/schemas/AdminListMeta'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: ['Admin: Products']
      operationId: adminCreateProduct
      summary: Create a product (admin only)
      description: 'The slug is generated from `latin_name`. New variants get a generated SKU and the given starting `stock`. Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: [], xsrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminProductInput'}
      responses:
        '201': {$ref: '#/components/responses/AdminProductCreated'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /admin/products/{product}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: ['Admin: Products']
      operationId: adminGetProduct
      summary: Full product for the editor
      description: 'Role: staff. Rate limit: admin 300/min.'
      x-required-role: staff
      security: [{sessionCookie: []}]
      responses:
        '200': {$ref: '#/components/responses/AdminProductOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: ['Admin: Products']
      operationId: adminUpdateProduct
      summary: Update a product (admin only)
      description: |
        Full replacement. Sizes missing from `variants` are deactivated, not deleted. `stock` is ignored on update, and a newly added size starts at 0;
        use `POST /admin/variants/{variant}/stock`. Notes and pyramid are replaced. Role: **admin**. Rate limit: admin 300/min.
      x-required-role: admin
      security: [{sessionCookie: [], xsrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminProductInput'}
      responses:
        '200': {$ref: '#/components/responses/AdminProductOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    delete:
      tags: ['Admin: Products']
      operationId: adminDeleteProduct
      summary: Deactivate and soft-delete a product (admin only)
      description: 'Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: [], xsrfHeader: []}]
      responses:
        '204': {description: Deleted.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}

  /admin/products/{product}/images:
    post:
      tags: ['Admin: Products']
      operationId: adminUploadProductImage
      summary: Upload a product image (admin only)
      description: 'Stored as WebP renditions (400/800/1600 px) and appended after the existing images. Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: [], xsrfHeader: []}]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  contentMediaType: image/*
                  description: jpg, jpeg, png or webp; max 5120 KB.
                alt: {type: string, maxLength: 160, description: Defaults to the product name.}
      responses:
        '201': {$ref: '#/components/responses/AdminProductCreated'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /admin/products/{product}/images/order:
    put:
      tags: ['Admin: Products']
      operationId: adminSortProductImages
      summary: Reorder images (admin only)
      description: '`ids` in display order; the first image becomes the card image. Ids that belong to other products are ignored. Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: [], xsrfHeader: []}]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: {type: integer}
      responses:
        '200': {$ref: '#/components/responses/AdminProductOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/products/{product}/images/{image}:
    delete:
      tags: ['Admin: Products']
      operationId: adminDeleteProductImage
      summary: Delete an image and its files (admin only)
      description: 'Returns 404 if the image belongs to another product. Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: [], xsrfHeader: []}]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - {name: image, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/AdminProductOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}

  /admin/stock/low:
    get:
      tags: ['Admin: Products']
      operationId: adminLowStock
      summary: Active variants at or below their low-stock threshold (max 50, lowest first)
      description: 'Role: staff. Rate limit: admin 300/min.'
      x-required-role: staff
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/LowStockRow'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/variants/{variant}/stock:
    post:
      tags: ['Admin: Products']
      operationId: adminAdjustStock
      summary: Adjust a variant's stock with a reason
      description: |
        Writes a `stock_movements` row. If the new stock would fall below the reserved quantity, returns 422 **without** an
        `errors` object (`{message: "لا يمكن أن يقل المخزون عن الكمية المحجوزة لطلبات قائمة (N)."}`). Role: staff. Rate limit: admin 300/min.
      x-required-role: staff
      security: [{sessionCookie: [], xsrfHeader: []}]
      parameters:
        - $ref: '#/components/parameters/VariantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [change, reason]
              properties:
                change: {type: integer, minimum: -10000, maximum: 10000, not: {const: 0}}
                reason: {type: string, enum: [restock, adjustment, damage]}
                note: {type: [string, 'null'], maxLength: 255}
      responses:
        '200': {$ref: '#/components/responses/AdminProductOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422':
          description: Validation failed, or the stock would fall below the reserved quantity (plain `{message}`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'

  /admin/variants/{variant}/movements:
    get:
      tags: ['Admin: Products']
      operationId: adminStockMovements
      summary: Last 50 stock movements of a variant
      description: 'Role: staff. Rate limit: admin 300/min.'
      x-required-role: staff
      security: [{sessionCookie: []}]
      parameters:
        - $ref: '#/components/parameters/VariantId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/StockMovement'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ─────────────────────────────── Admin: Store (all admin only)
  /admin/categories:
    get:
      tags: ['Admin: Store']
      operationId: adminListCategories
      summary: All categories with their spotlights (admin only)
      description: 'Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: []}]
      responses:
        '200': {$ref: '#/components/responses/AdminCategoriesOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/categories/{category}:
    put:
      tags: ['Admin: Store']
      operationId: adminUpdateCategory
      summary: Update a category (admin only)
      description: 'Returns the full category list. Invalidates the home cache. Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: [], xsrfHeader: []}]
      parameters:
        - {name: category, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 64, example: شرقي}
                latin_name: {type: [string, 'null'], maxLength: 64, example: Oriental}
                description: {type: [string, 'null'], maxLength: 1000}
                is_active: {type: boolean}
                sort: {type: integer, minimum: 0}
      responses:
        '200': {$ref: '#/components/responses/AdminCategoriesOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/spotlights:
    post:
      tags: ['Admin: Store']
      operationId: adminCreateSpotlight
      summary: Create a category spotlight (admin only)
      description: |
        `product_id` must belong to `category_id` and must not be deleted. The palette must pass the readability check: fg on bg >= 4.5:1,
        fg on surface >= 4.5:1, muted on bg >= 3:1. Failures go to `errors["palette.fg" | "palette.surface" | "palette.muted"]`.
        Role: **admin**. Rate limit: admin 300/min.
      x-required-role: admin
      security: [{sessionCookie: [], xsrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SpotlightInput'}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AdminSpotlight'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/spotlights/{spotlight}:
    parameters:
      - {name: spotlight, in: path, required: true, schema: {type: integer}}
    put:
      tags: ['Admin: Store']
      operationId: adminUpdateSpotlight
      summary: Update a spotlight (admin only)
      description: 'Same rules as create. Clears the `sample` flag. Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: [], xsrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SpotlightInput'}
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AdminSpotlight'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: ['Admin: Store']
      operationId: adminDeleteSpotlight
      summary: Delete a spotlight (admin only)
      description: 'Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: [], xsrfHeader: []}]
      responses:
        '204': {description: Deleted.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}

  /admin/governorates:
    get:
      tags: ['Admin: Store']
      operationId: adminListGovernorates
      summary: All governorates with shipping settings (admin only)
      description: 'Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: []}]
      responses:
        '200': {$ref: '#/components/responses/AdminGovernoratesOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: ['Admin: Store']
      operationId: adminUpdateGovernorates
      summary: Bulk-update shipping fees and delivery days (admin only)
      description: 'Updates only the rows sent, in one transaction. `active` defaults to true when omitted. Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: [], xsrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  items:
                    type: object
                    required: [id, fee, daysMin, daysMax]
                    properties:
                      id: {type: integer}
                      fee: {type: number, minimum: 0, maximum: 2000, description: EGP.}
                      daysMin: {type: integer, minimum: 0, maximum: 30}
                      daysMax: {type: integer, maximum: 30, description: Must be >= daysMin.}
                      active: {type: boolean, default: true}
      responses:
        '200': {$ref: '#/components/responses/AdminGovernoratesOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/settings:
    get:
      tags: ['Admin: Store']
      operationId: adminGetSettings
      summary: Store settings (admin only)
      description: 'Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: []}]
      responses:
        '200': {$ref: '#/components/responses/SettingsOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: ['Admin: Store']
      operationId: adminUpdateSettings
      summary: Update store settings (admin only)
      description: 'Body keys are camelCase, unlike other admin inputs. Empty announcements are dropped. Invalidates the home cache. Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: [], xsrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [freeShippingThreshold, discoveryPrice, discoveryCreditDays, giftWrapFee, reservationMinutes]
              properties:
                announcements:
                  type: array
                  maxItems: 5
                  items: {type: string, maxLength: 80}
                  example: [شحن مجاني فوق ١٠٠٠ ج.م]
                freeShippingThreshold: {type: number, minimum: 0, maximum: 100000}
                discoveryPrice: {type: number, minimum: 0, maximum: 10000}
                discoveryCreditDays: {type: integer, minimum: 1, maximum: 365}
                giftWrapFee: {type: number, minimum: 0, maximum: 1000}
                reservationMinutes: {type: integer, minimum: 5, maximum: 1440}
                whatsapp:
                  type: [string, 'null']
                  description: Any Egyptian mobile as typed (`01XXXXXXXXX`, `+20 1X…`, Arabic digits). Stored and returned in wa.me form `201XXXXXXXXX`.
                  example: '201012345678'
      responses:
        '200': {$ref: '#/components/responses/SettingsOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/finder:
    get:
      tags: ['Admin: Store']
      operationId: adminGetFinder
      summary: Finder questions with answer weights (admin only)
      description: 'Role: **admin**. Rate limit: admin 300/min.'
      x-required-role: admin
      security: [{sessionCookie: []}]
      responses:
        '200': {$ref: '#/components/responses/AdminFinderOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/finder/answers/{answer}:
    put:
      tags: ['Admin: Store']
      operationId: adminUpdateFinderAnswer
      summary: Update an answer's label and weights (admin only)
      description: |
        Replaces all weights. `categories` maps category slug -> weight in -5..5 (unknown slugs and zero weights are skipped).
        Each note in `notes` gets weight 2. Returns the whole finder. Role: **admin**. Rate limit: admin 300/min.
      x-required-role: admin
      security: [{sessionCookie: [], xsrfHeader: []}]
      parameters:
        - {name: answer, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: {type: string, maxLength: 80, example: دافئ وغامض}
                categories:
                  type: object
                  additionalProperties: {type: integer, minimum: -5, maximum: 5}
                  example: {oriental: 3, fresh: -2}
                notes:
                  type: array
                  maxItems: 20
                  items: {type: string, description: Must match an existing note name.}
                  example: [عود, عنبر]
      responses:
        '200': {$ref: '#/components/responses/AdminFinderOk'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '419': {$ref: '#/components/responses/CsrfMismatch'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

